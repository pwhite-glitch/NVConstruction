<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script>
    window.onload = function () {
      var params = new URLSearchParams(window.location.search);
      var key = params.get('key');
      var editMode = params.get('edit') === 'true';
      if (!key) return;
      var html = localStorage.getItem(key);
      if (!html) return;
      localStorage.removeItem(key);
      document.open('text/html', 'replace');
      document.write(html);
      document.close();

      if (editMode) {
        document.designMode = 'on';

        var style = document.createElement('style');
        style.textContent = [
          '#nv-edit-bar { position:fixed;top:0;left:0;right:0;z-index:9999;background:#1a1a1a;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:14px;font-family:sans-serif;font-size:13px;border-bottom:2px solid #e8590c; }',
          '#nv-edit-bar button { border:none;padding:8px 18px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer; }',
          '#nv-edit-bar .btn-print { background:#e8590c;color:#fff; }',
          '#nv-edit-bar .btn-print:hover { background:#d44d00; }',
          '#nv-edit-bar .hint { color:#888;font-size:12px; }',
          '@media print { #nv-edit-bar { display:none!important; } body { margin-top:0!important; } }'
        ].join('\n');
        document.head.appendChild(style);

        var bar = document.createElement('div');
        bar.id = 'nv-edit-bar';
        bar.innerHTML = [
          '<span style="font-weight:700;color:#e8590c;font-size:14px;">&#9998; Editing Mode</span>',
          '<span class="hint">Click any text on the contract to edit it, then print when ready.</span>',
          '<div style="flex:1"></div>',
          '<button class="btn-print" id="nv-print-btn">Print / Save PDF</button>'
        ].join('');
        document.body.insertBefore(bar, document.body.firstChild);
        document.body.style.marginTop = '50px';

        document.getElementById('nv-print-btn').addEventListener('click', function () {
          document.designMode = 'off';
          bar.style.display = 'none';
          document.body.style.marginTop = '';
          window.print();
          setTimeout(function () {
            document.designMode = 'on';
            bar.style.display = 'flex';
            document.body.style.marginTop = '50px';
          }, 1200);
        });

      } else {
        setTimeout(function () { window.print(); }, 800);
      }
    };
  </script>
</head>
<body></body>
</html>
